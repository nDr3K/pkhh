<div class="modal-overlay" *ngIf="isVisible">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>Upload Save File</h2>
      <button type="button" class="close-btn" (click)="closeModal()" aria-label="Close">
        <svg width="10" height="10" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M1 1L15 15M15 1L1 15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <form [formGroup]="uploadForm" (ngSubmit)="onSubmit()" class="modal-body">
      <!-- File Upload -->
      <div class="form-group">
        <label for="fileInput">Save File *</label>
        <div class="file-upload-container">
          <input
            #fileInput
            type="file"
            id="fileInput"
            accept=".sav"
            (change)="onFileSelected($event)"
            class="file-input-hidden"
          >
          <div
            class="file-drop-zone"
            [class.error]="selectedFile === null && formSubmitted"
            [class.has-file]="selectedFile"
            (click)="fileInput.click()"
            (dragover)="onDragOver($event)"
            (dragleave)="onDragLeave($event)"
            (drop)="onDrop($event)"
          >
            <div class="upload-content" *ngIf="!selectedFile">
              <div class="upload-icon">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                  <polyline points="7,10 12,15 17,10"></polyline>
                  <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
              </div>
              <div class="upload-text">
                <p class="primary-text">Click to upload or drag and drop</p>
                <p class="secondary-text">Supported formats: .sav</p>
              </div>
            </div>

            <div class="file-preview" *ngIf="selectedFile">
              <div class="file-icon">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M14,2H6A2,2 0 0,0 4,4V20A2,2 0 0,0 6,22H18A2,2 0 0,0 20,20V8L14,2M18,20H6V4H13V9H18V20Z"></path>
                </svg>
              </div>
              <div class="file-details">
                <span class="file-name">{{ selectedFile.name }}</span>
                <span class="file-size">{{ formatFileSize(selectedFile.size) }}</span>
              </div>
              <button
                type="button"
                class="remove-file-btn"
                (click)="removeFile($event)"
                title="Remove file"
              >
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <line x1="18" y1="6" x2="6" y2="18"></line>
                  <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
              </button>
            </div>
          </div>
        </div>
        <div class="error-text" *ngIf="selectedFile === null && formSubmitted">
          Please select a file to upload
        </div>
      </div>

      <!-- Name -->
      <div class="form-group">
        <label for="name">Name</label>
        <input
          type="text"
          id="name"
          formControlName="name"
          placeholder="Enter save file name"
          class="form-control"
        >
      </div>

      <!-- Generation -->
      <div class="form-group">
        <label for="game">Game</label>
        <select
          id="game"
          formControlName="game"
          class="form-control"
        >
          <option value="">Select Game</option>
          <option *ngFor="let game of games" [value]="game.id">Pokemon {{ game.name | titlecase }}</option>
        </select>
      </div>

      <!-- Description -->
      <div class="form-group">
        <label for="description">Description</label>
        <textarea
          id="description"
          formControlName="description"
          placeholder="Enter description (optional)"
          rows="3"
          class="form-control"
        ></textarea>
      </div>

<!--      &lt;!&ndash; Tags &ndash;&gt;-->
<!--      <div class="form-group">-->
<!--        <label for="tags">Tags</label>-->
<!--        <input-->
<!--          type="text"-->
<!--          id="tags"-->
<!--          formControlName="tagsInput"-->
<!--          placeholder="Enter tags separated by commas"-->
<!--          class="form-control"-->
<!--        >-->
<!--        <small class="help-text">Separate multiple tags with commas</small>-->
<!--      </div>-->

      <!-- Error Message -->
      <div class="error-message" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <!-- Loading Indicator -->
      <div class="loading-indicator" *ngIf="isUploading">
        <div class="spinner"></div>
        <span>Uploading file...</span>
      </div>
    </form>

    <div class="modal-footer">
      <button
        type="button"
        class="button button--secondary button--compact"
        (click)="closeModal()"
        [disabled]="isUploading"
      >
        Cancel
      </button>
      <button
        type="submit"
        class="button button--primary button--compact"
        (click)="onSubmit()"
        [disabled]="isUploading || (!selectedFile && formSubmitted)"
      >
        {{ isUploading ? 'Uploading...' : 'Upload' }}
      </button>
    </div>
  </div>
</div>
