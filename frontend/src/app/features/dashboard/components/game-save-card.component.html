<div class="game-save-card" [class]="'game-' + getGameClass(gameSave.game)">
  <!-- Card Header -->
  <div class="card-header">
    <div class="header-content">
      <div class="save-icon">

>
            <path d="M1750 3630 l0 -750 815 0 815 0 0 750 0 750 -815 0 -815 0 0 -750z m1530 0 l0 -640 -715 0 -715 0 0 640 0 640 715 0 715 0 0 -640z"/>
            <path d="M1495 3908 c-58 -33 -41 -108 25 -108 34 0 60 23 60 54 0 45 -47 75 -85 54z"/>
          </g>
        </svg>
      </div>
      <div class="game-header-container">
        <h3 class="game-save-name">{{ gameSave.name }}</h3>
        <div class="game-badge" [style.background-color]="getGameColor(gameSave.game)">
          {{ gameSave.game }}
        </div>
      </div>
    </div>
  </div>

  <!-- Pokemon Team Row -->
  <div class="pokemon-team">
    <div
      *ngFor="let pokemon of gameSave.team; trackBy: trackByPokemon"
      class="pokemon-slot"
      [title]="pokemon.name"
    >
      <img
        [ngSrc]="getPokemonImageUrl(pokemon.dexNumber)"
        [alt]="pokemon.name"
        class="pokemon-image"
        (error)="onImageError($event)"
        loading="lazy"
        width="48"
        height="48"/>
      <span class="pokemon-name">{{ pokemon.name }}</span>
    </div>

    <!-- Empty slots if team has less than 6 Pokemon -->
    <div
      *ngFor="let empty of getEmptySlots(); trackBy: trackByIndex"
      class="pokemon-slot empty-slot"
    >
      <div class="empty-pokeball">
        <span>?</span>
      </div>
    </div>
  </div>

  <!-- Footer with timestamp -->
  <div class="card-footer">
    <button class="button button--primary button--compact" (click)="onDetailsClick()">
      View details
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 3h6v6"></path>
        <path d="M10 14 21 3"></path>
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
      </svg>
    </button>
    <div class="timestamp">
      <span class="timestamp-label">Last played:</span>
      <span class="timestamp-value">{{ formatDate(gameSave.updatedAt) }}</span>
    </div>
  </div>
</div>
