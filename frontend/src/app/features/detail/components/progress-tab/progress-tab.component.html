<div class="tab-content" *ngIf="gameSave">
  <div class="progress-section">
    <h4 class="section-title">Badges</h4>
    <div class="badges-grid" *ngIf="gameSave.badges && gameSave.badges.length > 0">
      <span class="badge-item"
            *ngFor="let x of [1, 2, 3, 4, 5, 6, 7, 8]"
            [class.obtained]="gameSave.badges.includes(x)">
        Badge {{ x }}
      </span>
    </div>
    <div *ngIf="!gameSave.badges || gameSave.badges.length === 0" class="empty-state">
      <p>No badge data available.</p>
    </div>
  </div>
  <div class="pokedex-section">
    <h4 class="section-title">Pokedex</h4>
    <div class="pokedex-stats">
      <div class="stat-card">
        <div class="stat-number">{{ gameSave.pokemonCaught || 0 }}</div>
        <div class="stat-label">Pokemon Caught</div>
      </div>
      <div class="stat-card">
        <div class="stat-number">{{ gameSave.pokemonSeen || 0 }}</div>
        <div class="stat-label">Pokemon Seen</div>
      </div>
    </div>
  </div>
</div>
