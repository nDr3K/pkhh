<app-page-layout>
  <div class="page-container">
    <!-- Main Content -->
    <div *ngIf="!isLoading && gameSave" class="main-content">
      <div class="container">
        <app-breadcrumb
          [items]="breadcrumbItems"
          [separator]="'>'"
          [showIcons]="true"
          [clickable]="true"
          (itemClick)="onBreadcrumbClick($event)">
        </app-breadcrumb>
        <!-- Content Grid -->
        <div class="content-grid">
          <!-- Main Content -->
          <div class="main-column">
            <div class="card">
              <app-detail-header [gameSave]="gameSave"></app-detail-header>
              <div class="card-content">
                <app-detail-tabs (tabChange)="setActiveTab($event)"></app-detail-tabs>
                <app-summary-tab *ngIf="activeTab === 'summary'" [gameSave]="gameSave"></app-summary-tab>
                <app-pokemon-tab *ngIf="activeTab === 'pokemon'" [gameSave]="gameSave"></app-pokemon-tab>
                <app-boxes-tab *ngIf="activeTab === 'boxes'" [gameSave]="gameSave"></app-boxes-tab>
                <app-progress-tab *ngIf="activeTab === 'progress'" [gameSave]="gameSave"></app-progress-tab>
              </div>
            </div>
          </div>

          <!-- Sidebar -->
          <div class="sidebar">
            <app-actions-sidebar
              [gameSave]="gameSave"
              [isDeleting]="isDeleting"
              (delete)="handleDelete()"
              (update)="handleUpdate()"
            ></app-actions-sidebar>
            <app-file-info-sidebar [gameSave]="gameSave"></app-file-info-sidebar>
          </div>
        </div>
      </div>
    </div>
  </div>
</app-page-layout>
